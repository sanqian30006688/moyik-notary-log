name: mirror

# Copies Moyik's public notary log into this repository four times a day and checks it.
# It reads public pages only and needs no secret. It uses no third-party action: the steps
# below are plain git, Python and the GitHub CLI that the runner already has.

on:
  schedule:
    - cron: '23 */6 * * *'
  workflow_dispatch:

# contents: commit the new files. issues: open one issue when a run fails. Nothing else.
permissions:
  contents: write
  issues: write

concurrency:
  group: mirror
  cancel-in-progress: false

jobs:
  mirror:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Get the repository
        run: |
          git init -q .
          git remote add origin "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          git fetch -q --depth 1 origin "${GITHUB_REF_NAME}"
          git checkout -q -B "${GITHUB_REF_NAME}" FETCH_HEAD

      - name: Signature library
        run: |
          python3 -m venv "${RUNNER_TEMP}/venv"
          "${RUNNER_TEMP}/venv/bin/pip" install --quiet cryptography==50.0.1

      - name: Copy and check
        run: |
          set -o pipefail
          "${RUNNER_TEMP}/venv/bin/python" mirror.py 2>&1 | tee "${RUNNER_TEMP}/mirror.log"

      - name: Commit what is new
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add checkpoints anchors keys.json
          if git diff --cached --quiet; then
            echo "nothing new"
          else
            git commit -q -m "mirror $(date -u +%Y-%m-%dT%H:%MZ)"
            git push -q origin "HEAD:${GITHUB_REF_NAME}"
          fi

      - name: Open an issue when the run fails
        if: failure()
        run: |
          title="Mirror run failed"
          if grep -q '^PROBLEM:' "${RUNNER_TEMP}/mirror.log" 2>/dev/null; then
            title="The log no longer matches the copy saved here"
          fi
          {
            echo "Run: ${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
            echo
            echo '```'
            tail -n 20 "${RUNNER_TEMP}/mirror.log" 2>/dev/null || echo "no output"
            echo '```'
            echo
            echo "A line starting with PROBLEM means the source served something that disagrees with what this repository already holds, or with itself. Nothing was overwritten. Anything else is an ordinary failure (network, runner)."
          } > "${RUNNER_TEMP}/issue.md"
          open=$(gh issue list --repo "${GITHUB_REPOSITORY}" --state open --search "\"${title}\" in:title" --json number --jq '.[0].number')
          if [ -n "${open}" ]; then
            gh issue comment "${open}" --repo "${GITHUB_REPOSITORY}" --body-file "${RUNNER_TEMP}/issue.md"
          else
            gh issue create --repo "${GITHUB_REPOSITORY}" --title "${title}" --body-file "${RUNNER_TEMP}/issue.md"
          fi
